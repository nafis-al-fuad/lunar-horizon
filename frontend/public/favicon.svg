<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E5A93C" stop-opacity="1"/>
      <stop offset="60%" stop-color="#F5BA4F" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E5A93C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonShade" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="60%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="32" height="32" rx="7" fill="#07090E"/>
  
  <!-- Outer Reticle Ring -->
  <circle cx="16" cy="16" r="12" stroke="#222B3D" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Moon Body -->
  <circle cx="16" cy="16" r="10" fill="url(#moonShade)" stroke="#475569" stroke-width="1"/>

  <!-- Lunar South Polar Rim Shadow Contour -->
  <path d="M 6 16 A 10 10 0 0 0 24 22 A 10 8 0 0 1 6 16 Z" fill="#0A0D14" opacity="0.75"/>

  <!-- Illuminated South Pole Ridge (Artemis Shackleton Peak) -->
  <path d="M 10 22 Q 16 19 22 23" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Solar Crest Star / Amber Disc at South Pole -->
  <circle cx="16" cy="20.5" r="3.5" fill="url(#sunGlow)"/>
  <circle cx="16" cy="20.5" r="1.8" fill="#FFFBEB" stroke="#E5A93C" stroke-width="0.8"/>
</svg>
